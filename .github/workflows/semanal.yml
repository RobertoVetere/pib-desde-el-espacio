name: Actualización semanal

on:
  schedule:
    - cron: "17 5 * * 1"  # lunes, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: NO2 de Sentinel-5P (solo días nuevos)
        run: python src/no2.py --hilos 16
      - name: Meteorología (NASA POWER)
        run: python src/meteo.py
      - name: Series oficiales (INE)
        run: python src/oficiales.py
      - name: Backtest y gráfico
        working-directory: src
        run: |
          python backtest.py
          python grafico.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data resultados
          git diff --cached --quiet || git commit -m "Actualización semanal de datos y resultados"
          git push
